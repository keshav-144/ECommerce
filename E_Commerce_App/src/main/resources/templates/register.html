<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Register - BootStore</title>
	<link rel="stylesheet" th:href="@{/css/home.css}">
</head>
<body>
	<!-- NAVBAR -->
	<nav class="navbar">
		<div class="logo">BootStore</div>
		<ul class="nav-links">
			<li><a href="/">Home</a></li>
			<li><a href="/login">Login</a></li>
			<li><a href="/register">Register</a></li>
		</ul>
	</nav>

	<div class="login-container">
		<div class="login-card">
			<div class="left-panel">
				<div class="left-top">
					<h2>BootStore</h2>
				</div>
				<div class="left-bottom">
					<p>Join our community</p>
					<h2>Register your account and start your journey today.</h2>
				</div>
			</div>
			<div class="right-panel">
				<form th:action="@{/regForm}" th:object="${user}" method="post">
					<h2 class="login-heading">Create Account</h2>
					<div th:if="${successMsg}" class="success-box" style="color: green; text-align: center;">
						<h3 th:text="${successMsg}"></h3>
					</div>
					<div th:if="${errorMsg}" class="error-box" style="color: red; text-align: center;">
						<h3 th:text="${errorMsg}"></h3>
					</div>
					<div class="form-group">
						<label>Full Name</label>
						<input type="text" th:field="*{name}" placeholder="John Doe" required>
					</div>
					<div class="form-group">
						<label>Email Address</label>
						<input type="email" th:field="*{email}" placeholder="john@example.com" required>
					</div>
					<div class="form-group">
						<label>Password</label>
						<input type="password" th:field="*{password}" placeholder="Secure Password" required>
					</div>
					<div class="form-group">
						<label>Phone Number</label>
						<input type="number" th:field="*{phoneno}" placeholder="+91 ----------" required>
					</div>
					<div class="form-group">
						<label>City</label>
						<input type="text" th:field="*{city}" placeholder="Your city" required>
					</div>
					<button type="submit" class="login-btn">Create Account</button>
					<p style="margin-top: 20px; text-align: center; font-size: 0.9rem;">
						Already have an account? <a href="/login" style="color: #223a5e; font-weight: bold;">Login now</a>
					</p>
				</form>
			</div>
		</div>
	</div>

	<div class="footer">
		© 2026 BootStore. All rights reserved.
	</div>
</body>
</html>
